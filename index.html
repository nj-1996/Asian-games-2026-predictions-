<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Asian Games 2026 • Tournament Projections & Tracker</title>

  <!-- Auto-versioned Stylesheet -->
  <script>
    const ver = Date.now();
    document.write(`<link rel="stylesheet" href="css/style.css?v=${ver}">`);
  </script>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="header-title">
        <span class="event-name">Asian Games</span>
        <div class="sport-select-wrap">
          <select id="sport-select" class="sport-dropdown" onchange="handleSportChange(this.value)">
            <option value="basketball">🏀 Basketball</option>
            <option value="football">⚽ Football</option>
            <option value="volleyball">🏐 Volleyball</option>
            <option value="modern_pentathlon">🎯 Modern Pentathlon</option>
            <option value="cricket">🏏 Cricket</option>
            <option value="teqball">🏓 Teqball</option>
          </select>
        </div>
      </div>

      <button class="sync-status" id="live-sync-btn" onclick="handleManualSync()">
        <span class="sync-dot" id="sync-indicator"></span>
        <span id="sync-label">Live Sync</span>
      </button>
    </div>

    <div class="nav-controls">
      <div class="gender-group">
        <button class="gender-btn active" id="btn-men" onclick="setGender('men')">Men</button>
        <button class="gender-btn" id="btn-women" onclick="setGender('women')">Women</button>
        <button class="gender-btn" id="btn-mixed" onclick="setGender('mixed')" style="display:none;">Mixed</button>
      </div>
      <div class="tab-group">
        <button class="nav-btn active" id="tab-matches" onclick="setTab('matches')">Matches</button>
        <button class="nav-btn" id="tab-predictions" onclick="setTab('predictions')">Predictions</button>
        <button class="nav-btn" id="tab-calibration" onclick="setTab('calibration')">Calibration</button>
      </div>
    </div>
  </header>

  <main id="content-cards">
    <div class="empty-state">Loading tournament data...</div>
  </main>

  <!-- Sync Toast Notification -->
  <div id="sync-toast" class="sync-toast">Fetching complete!</div>

  <!-- Auto-versioned Scripts -->
  <script>
    const scriptVer = Date.now();
    [
      "js/core.js",
      "js/sports/basketball.js",
      "js/sports/football.js",
      "js/sports/volleyball.js",
      "js/sports/modern_pentathlon.js",
      "js/sports/cricket.js",
      "js/sports/teqball.js",
      "js/app.js"
    ].forEach(src => {
      document.write(`<script src="${src}?v=${scriptVer}"><\/script>`);
    });
  </script>
</body>
</html>
