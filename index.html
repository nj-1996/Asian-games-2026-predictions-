<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aichi-Nagoya 2026 Predictions</title>
  <style>
    :root { --bg: #0b0f19; --card: #151d30; --border: #22304e; --text: #f1f5f9; --muted: #94a3b8; --gold: #facc15; --silver: #cbd5e1; --bronze: #fb923c; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; font-size: 14px; }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    p.sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 12px; }
    #status { padding: 10px; border-radius: 6px; font-size: 0.82rem; margin-bottom: 14px; background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); }
    select { width: 100%; padding: 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: #fff; font-size: 0.95rem; margin-bottom: 16px; outline: none; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #1a253e; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; padding: 10px 8px; letter-spacing: 0.05em; }
    td { padding: 9px 8px; border-top: 1px solid var(--border); font-size: 0.82rem; white-space: nowrap; }
    .gold { color: var(--gold); font-weight: bold; }
    .silver { color: var(--silver); font-weight: bold; }
    .bronze { color: var(--bronze); font-weight: bold; }
    .text-right { text-align: right; }
    .badge { display: inline-block; padding: 2px 5px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; margin-right: 4px; }
    .badge-gold { background: rgba(250, 204, 21, 0.2); color: var(--gold); }
    .badge-silver { background: rgba(203, 213, 225, 0.2); color: var(--silver); }
    .badge-bronze { background: rgba(251, 146, 60, 0.2); color: var(--bronze); }
  </style>
</head>
<body>
  <h1>Asian Games 2026 Model</h1>
  <p class="sub">Predictions across tournament disciplines</p>
  
  <div id="status">Connecting to sports repository...</div>

  <select id="sportSelect" onchange="loadSportData(this.value)">
    <option value="">-- Choose Sport --</option>
  </select>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Contender</th>
          <th class="text-right">Gold %</th>
          <th class="text-right">Silver %</th>
          <th class="text-right">Bronze %</th>
          <th class="text-right">Total %</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    // Robust root path calculation for GitHub Pages
    const currentPath = window.location.pathname;
    const repoBase = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);

    function showStatus(msg, isError = false) {
      const box = document.getElementById('status');
      box.style.display = 'block';
      box.textContent = msg;
      if (isError) {
        box.style.background = 'rgba(239, 68, 68, 0.15)';
        box.style.color = '#f87171';
        box.style.borderColor = '#ef4444';
      } else {
        box.style.background = 'rgba(56, 189, 248, 0.1)';
        box.style.color = '#38bdf8';
        box.style.borderColor = 'rgba(56, 189, 248, 0.2)';
      }
    }

    async function init() {
      const selector = document.getElementById('sportSelect');
      const targetUrl = window.location.origin + repoBase + 'sports.json?t=' + Date.now();

      try {
        showStatus('Loading sports list...');
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error('File sports.json not found (HTTP ' + res.status + ')');
        
        const sportsList = await res.json();
        selector.innerHTML = '';
        
        sportsList.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.file;
          opt.textContent = item.name;
          selector.appendChild(opt);
        });

        document.getElementById('status').style.display = 'none';

        if (sportsList.length > 0) {
          loadSportData(sportsList[0].file);
        }
      } catch (err) {
        showStatus('Error: ' + err.message + '. Make sure sports.json is created in the repository.', true);
      }
    }

    async function loadSportData(fileName) {
      if (!fileName) return;
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:#94a3b8;">Loading match probabilities...</td></tr>';

      const fileUrl = window.location.origin + repoBase + fileName + '?t=' + Date.now();

      try {
        const res = await fetch(fileUrl);
        if (!res.ok) throw new Error('Could not find ' + fileName + ' (HTTP ' + res.status + ')');
        const payload = await res.json();

        tbody.innerHTML = '';
        payload.data.forEach((row, i) => {
          const tr = document.createElement('tr');
          let badge = '';
          if (i === 0) badge = '<span class="badge badge-gold">🥇 1st</span>';
          else if (i === 1) badge = '<span class="badge badge-silver">🥈 2nd</span>';
          else if (i === 2) badge = '<span class="badge badge-bronze">🥉 3rd</span>';

          tr.innerHTML = `
            <td>${badge}<strong>${row.name}</strong></td>
            <td class="text-right gold">${row.gold}%</td>
            <td class="text-right silver">${row.silver}%</td>
            <td class="text-right bronze">${row.bronze}%</td>
            <td class="text-right"><strong>${row.total}%</strong></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171; padding:20px;">Error: ${err.message}</td></tr>`;
      }
    }

    init();
  </script>
</body>
</html>
