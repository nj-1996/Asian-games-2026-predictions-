<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asian Games 2026 - Hub</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --win-color: #22c55e;
      --gold: #f59e0b;
      --silver: #94a3b8;
      --bronze: #b45309;
      --badge-live: #ef4444;
      --badge-finished: #475569;
      --badge-upcoming: #3b82f6;
      --badge-danger: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 14px 40px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .main-nav {
      display: flex;
      background-color: #1e293b;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .main-nav-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .main-nav-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .select-wrapper {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .select-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .custom-select {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
    }

    /* Accuracy & Calibration KPI Bar */
    .accuracy-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
    }

    .kpi-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .kpi-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--win-color);
    }

    .kpi-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cards-list {
      display: grid;
      grid-gap: 12px;
    }

    .match-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .match-round {
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .match-datetime {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge.finished { background: rgba(100, 116, 139, 0.3); color: #94a3b8; }
    .badge.live { background: rgba(239, 68, 68, 0.25); color: #f87171; }
    .badge.upcoming { background: rgba(59, 130, 246, 0.25); color: #60a5fa; }
    .badge.model { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge.danger { background: rgba(244, 63, 94, 0.25); color: #fb7185; }

    .card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .team {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team.left { text-align: left; }
    .team.right { text-align: right; }
    .team.winner { color: var(--win-color); }

    .score-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 10px;
    }

    .score-badge {
      background: #0b1120;
      border: 1px solid var(--card-border);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 800;
      min-width: 80px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Table Styles */
    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    .medal-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .medal-table th {
      padding: 12px 14px;
      background: #0f172a;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--card-border);
    }

    .medal-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      font-weight: 600;
    }

    .medal-table tr:last-child td {
      border-bottom: none;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rank-num {
      color: var(--text-muted);
      font-size: 0.8rem;
      width: 16px;
    }

    .gold-cell { color: var(--gold); }
    .silver-cell { color: var(--silver); }
    .bronze-cell { color: var(--bronze); }
    .podium-cell { color: var(--win-color); }

    .pill-status {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .pill-on-track { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .pill-contested { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .pill-at-risk { background: rgba(244, 63, 94, 0.2); color: #fb7185; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 14px;
      font-size: 0.95rem;
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Asian Games 2026</h1>
    <p id="view-subtitle">Live Match Tracker</p>
  </header>

  <div class="main-nav">
    <button id="nav-tracker" class="main-nav-btn active" onclick="switchMainTab('tracker')">
      📊 Match Tracker
    </button>
    <button id="nav-predictions" class="main-nav-btn" onclick="switchMainTab('predictions')">
      🎯 Medal Projections & Calibration
    </button>
  </div>

  <div class="filter-grid">
    <div class="select-wrapper">
      <label class="select-label" for="select-sport">Sport</label>
      <select id="select-sport" class="custom-select" onchange="onSportChange()">
        <option value="basketball">🏀 Basketball</option>
      </select>
    </div>

    <div class="select-wrapper" id="wrapper-event">
      <label class="select-label" for="select-event">Division</label>
      <select id="select-event" class="custom-select" onchange="onEventChange()">
        <option value="men">Men's Tournament</option>
        <option value="women">Women's Tournament</option>
      </select>
    </div>
  </div>

  <div id="content-cards" class="cards-list">
    <div class="empty-state">Loading data...</div>
  </div>

  <script>
    const SPORT_CONFIG = {
      basketball: {
        name: "Basketball",
        predictionsFile: "data/basketball/predictions.json",
        trackerFiles: {
          men: "data/basketball/tracker_men.json",
          women: "data/basketball/tracker_women.json"
        }
      }
    };

    let currentTab = 'tracker';

    function switchMainTab(tab) {
      currentTab = tab;
      const navTracker = document.getElementById('nav-tracker');
      const navPredictions = document.getElementById('nav-predictions');
      const subtitle = document.getElementById('view-subtitle');

      if (tab === 'predictions') {
        navPredictions.classList.add('active');
        navTracker.classList.remove('active');
        subtitle.innerText = 'Monte Carlo Predictions & Live Calibration';
      } else {
        navTracker.classList.add('active');
        navPredictions.classList.remove('active');
        subtitle.innerText = 'Live Match Tracker';
      }
      loadCurrentView();
    }

    function onSportChange() { loadCurrentView(); }
    function onEventChange() { loadCurrentView(); }

    function loadCurrentView() {
      const sportKey = document.getElementById('select-sport').value;
      const divisionKey = document.getElementById('select-event').value;
      const config = SPORT_CONFIG[sportKey];
      if (!config) return;

      if (currentTab === 'predictions') {
        loadCalibrationAndPredictions(config.predictionsFile, config.trackerFiles[divisionKey], divisionKey);
      } else {
        const filePath = config.trackerFiles[divisionKey];
        if (filePath) loadMatches(filePath);
      }
    }

    // Name normalization to match tracker strings with model entries
    function normName(name) {
      return (name || '')
        .toLowerCase()
        .replace(/\s*\(host\)/g, '')
        .replace(/republic of\s*/g, '')
        .replace(/ir\s*/g, '')
        .replace(/\./g, '')
        .trim();
    }

    // --- PREDICTIONS & CALIBRATION LOADER ---
    function loadCalibrationAndPredictions(predFile, trackerFile, division) {
      const container = document.getElementById('content-cards');
      container.innerHTML = '<div class="empty-state">Calculating model calibration...</div>';

      Promise.all([
        fetch(predFile + '?_nocache=' + Date.now()).then(r => r.json()),
        fetch(trackerFile + '?_nocache=' + Date.now()).then(r => r.json()).catch(() => ({ matches: [] }))
      ])
      .then(([predData, trackerData]) => {
        const teams = (division === 'women') ? predData.women : predData.men;
        const matches = trackerData.matches || [];
        renderPredictionsView(teams, predData, matches);
      })
      .catch(err => {
        container.innerHTML = `<div class="empty-state">Failed to load prediction or tracker datasets.</div>`;
      });
    }

    function renderPredictionsView(teams, meta, matches) {
      const container = document.getElementById('content-cards');
      if (!teams || teams.length === 0) {
        container.innerHTML = '<div class="empty-state">No simulation data available.</div>';
        return;
      }

      // Rank mapping
      const rankMap = {};
      teams.forEach(t => {
        rankMap[normName(t.team)] = t.rank;
      });

      // Compute actual records and track upsets
      const records = {};
      let finishedCount = 0;
      let favoriteHits = 0;
      const upsets = [];

      matches.forEach(m => {
        if (m.status !== 'Finished' || !m.winner) return;
        finishedCount++;

        const p1Norm = normName(m.player1);
        const p2Norm = normName(m.player2);
        const wNorm = normName(m.winner);

        records[p1Norm] = records[p1Norm] || { w: 0, l: 0 };
        records[p2Norm] = records[p2Norm] || { w: 0, l: 0 };

        if (wNorm === p1Norm) {
          records[p1Norm].w++;
          records[p2Norm].l++;
        } else {
          records[p2Norm].w++;
          records[p1Norm].l++;
        }

        const r1 = rankMap[p1Norm] || 99;
        const r2 = rankMap[p2Norm] || 99;

        if (r1 !== r2) {
          const favoriteNorm = r1 < r2 ? p1Norm : p2Norm;
          if (wNorm === favoriteNorm) {
            favoriteHits++;
          } else {
            upsets.push({
              winner: m.winner,
              loser: (wNorm === p1Norm) ? m.player2 : m.player1,
              score: m.score,
              round: m.round
            });
          }
        }
      });

      const accuracy = finishedCount > 0 ? Math.round((favoriteHits / finishedCount) * 100) : 100;
      const alignmentStatus = accuracy >= 75 ? 'Optimal' : (accuracy >= 50 ? 'Moderate' : 'Volatile');

      // 1. KPI Calibration Summary
      let kpiHtml = `
        <div class="accuracy-grid">
          <div class="kpi-card">
            <div class="kpi-title">Model Accuracy</div>
            <div class="kpi-val">${accuracy}%</div>
            <div class="kpi-sub">${favoriteHits}/${finishedCount} favorites won</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-title">Upsets Logged</div>
            <div class="kpi-val" style="color: ${upsets.length > 0 ? '#fb7185' : '#4ade80'}">${upsets.length}</div>
            <div class="kpi-sub">${upsets.length === 0 ? 'No upsets yet' : 'Underdog wins'}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-title">Calibration</div>
            <div class="kpi-val" style="color: #60a5fa">${alignmentStatus}</div>
            <div class="kpi-sub">50k Sim Alignment</div>
          </div>
        </div>
      `;

      // 2. Simulation Meta Header
      let metaHeader = `
        <div class="match-card" style="margin-bottom: 10px;">
          <div class="card-header">
            <span>Simulation: <strong>${meta.simulation_model || 'Monte Carlo'}</strong></span>
            <span class="badge model">Host Boost: ${meta.home_court_boost || '+3.8'}</span>
          </div>
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
            ${meta.weighting || 'FIBA Rankings + Asia Cup 2025 Weighting'}
          </p>
        </div>
      `;

      // 3. Medal Table with Real-Time Record & Trajectory
      let tableHtml = `
        <div class="table-container">
          <table class="medal-table">
            <thead>
              <tr>
                <th>Team</th>
                <th>Record</th>
                <th>Trajectory</th>
                <th class="gold-cell">🥇 Gold</th>
                <th class="podium-cell">Podium</th>
              </tr>
            </thead>
            <tbody>
              ${teams.map(t => {
                const rec = records[normName(t.team)] || { w: 0, l: 0 };
                let trajectory = '<span class="pill-status pill-on-track">On Track</span>';
                if (rec.l >= 2) {
                  trajectory = '<span class="pill-status pill-at-risk">At Risk</span>';
                } else if (rec.l === 1) {
                  trajectory = '<span class="pill-status pill-contested">Contested</span>';
                }

                return `
                  <tr>
                    <td>
                      <div class="team-cell">
                        <span class="rank-num">${t.rank}</span>
                        <span>${t.team}</span>
                      </div>
                    </td>
                    <td>${rec.w}-${rec.l}</td>
                    <td>${trajectory}</td>
                    <td class="gold-cell">${t.gold}</td>
                    <td class="podium-cell">${t.podium}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      // 4. Upsets Callout (if any occurred)
      let upsetsHtml = '';
      if (upsets.length > 0) {
        upsetsHtml = `
          <div style="margin-top: 14px;">
            <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">
              ⚠️ Model Deviations / Upsets Logged
            </div>
            ${upsets.map(u => `
              <div class="match-card" style="border-left: 3px solid var(--badge-danger); padding: 10px 14px; margin-bottom: 6px;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                  <span><strong>${u.winner}</strong> def. ${u.loser}</span>
                  <span style="font-weight: 700; color: #fb7185;">${u.score}</span>
                </div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">${u.round}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      container.innerHTML = kpiHtml + metaHeader + tableHtml + upsetsHtml;
    }

    // --- MATCH TRACKER LOADER ---
    function loadMatches(filePath) {
      const container = document.getElementById('content-cards');
      container.innerHTML = '<div class="empty-state">Loading live fixtures...</div>';

      fetch(filePath + '?_nocache=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          renderMatches(data.matches || []);
        })
        .catch(err => {
          container.innerHTML = `<div class="empty-state">No fixtures loaded for this division.</div>`;
        });
    }

    function renderMatches(matches) {
      const container = document.getElementById('content-cards');
      if (!matches || matches.length === 0) {
        container.innerHTML = '<div class="empty-state">No matches scheduled.</div>';
        return;
      }

      container.innerHTML = matches.map(m => {
        const isP1Win = m.winner && (m.winner.trim().toLowerCase() === m.player1.trim().toLowerCase());
        const isP2Win = m.winner && (m.winner.trim().toLowerCase() === m.player2.trim().toLowerCase());
        const statusClass = (m.status || 'upcoming').toLowerCase();

        let dateDisplay = m.date || '';
        if (dateDisplay && dateDisplay.includes('-')) {
          const parts = dateDisplay.split('-');
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const monthIndex = parseInt(parts[1], 10) - 1;
          dateDisplay = `${parts[2]} ${months[monthIndex] || ''}`;
        }

        const dateTimeStr = [dateDisplay, m.time].filter(Boolean).join(' • ');

        return `
          <div class="match-card">
            <div class="card-header">
              <div class="header-titles">
                <span class="match-round">${m.round || 'Match'}</span>
                ${dateTimeStr ? `<span class="match-datetime">📅 ${dateTimeStr}</span>` : ''}
              </div>
              <span class="badge ${statusClass}">${m.state || m.status}</span>
            </div>
            <div class="card-body">
              <span class="team left ${isP1Win ? 'winner' : ''}">${m.player1}</span>
              <div class="score-container">
                <span class="score-badge">${m.score}</span>
              </div>
              <span class="team right ${isP2Win ? 'winner' : ''}">${m.player2}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    loadCurrentView();
  </script>
</body>
</html>
