<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Asian Games 2026</title>
  <style>
    :root {
      --bg: #0b0f19; --card: #151d30; --border: #22304e; --text: #f1f5f9;
      --muted: #94a3b8; --gold: #facc15; --silver: #cbd5e1; --bronze: #fb923c;
      --live: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; font-size: 14px; }
    h1 { font-size: 1.25rem; margin-bottom: 2px; }
    p.sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 12px; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .nav-tab { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-weight: 600; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .nav-tab.active { background: #38bdf8; color: #0b0f19; border-color: #38bdf8; }

    #status { padding: 10px; border-radius: 6px; font-size: 0.82rem; margin-bottom: 14px; display: none; }
    select { width: 100%; padding: 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: #fff; font-size: 0.95rem; margin-bottom: 14px; outline: none; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #1a253e; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; padding: 10px 8px; letter-spacing: 0.05em; }
    td { padding: 9px 8px; border-top: 1px solid var(--border); font-size: 0.82rem; white-space: nowrap; }
    .gold { color: var(--gold); font-weight: bold; }
    .silver { color: var(--silver); font-weight: bold; }
    .bronze { color: var(--bronze); font-weight: bold; }
    .text-right { text-align: right; }
    .badge { display: inline-block; padding: 2px 5px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; margin-right: 4px; }
    .badge-gold { background: rgba(250, 204, 21, 0.2); color: var(--gold); }
    .badge-silver { background: rgba(203, 213, 225, 0.2); color: var(--silver); }
    .badge-bronze { background: rgba(251, 146, 60, 0.2); color: var(--bronze); }

    .match-list { display: flex; flex-direction: column; gap: 10px; }
    .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .match-header { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .tag { padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.68rem; }
    .tag-live { background: rgba(34, 197, 94, 0.2); color: var(--live); }
    .tag-finished { background: rgba(148, 163, 184, 0.15); color: var(--muted); }
    .tag-upcoming { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .match-team { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 3px 0; }
    .winner { color: #38bdf8; font-weight: 700; }
    .match-score { font-size: 0.82rem; color: var(--muted); margin-top: 4px; border-top: 1px dashed var(--border); padding-top: 4px; text-align: right; }
  </style>
</head>
<body>
  <h1>Asian Games 2026</h1>
  <p class="sub">Model Projections & Match Tracker</p>

  <div class="nav-tabs">
    <div class="nav-tab active" id="tab-prob" onclick="switchView('prob')">Model Predictions</div>
    <div class="nav-tab" id="tab-tracker" onclick="switchView('tracker')">Match Tracker</div>
  </div>
  
  <div id="status"></div>
  <select id="sportSelect" onchange="onSportChange()"></select>

  <div id="view-prob" class="card">
    <table>
      <thead>
        <tr>
          <th>Contender</th>
          <th class="text-right">Gold %</th>
          <th class="text-right">Silver %</th>
          <th class="text-right">Bronze %</th>
          <th class="text-right">Total %</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div id="view-tracker" style="display: none;">
    <div id="trackerList" class="match-list"></div>
  </div>

  <script>
    let sportsIndex = [];
    let currentView = 'prob';

    function showStatus(msg, isError = false) {
      const box = document.getElementById('status');
      box.style.display = 'block';
      box.textContent = msg;
      box.style.background = isError ? 'rgba(239, 68, 68, 0.15)' : 'rgba(56, 189, 248, 0.1)';
      box.style.color = isError ? '#f87171' : '#38bdf8';
      box.style.borderColor = isError ? '#ef4444' : 'rgba(56, 189, 248, 0.2)';
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('tab-prob').classList.toggle('active', view === 'prob');
      document.getElementById('tab-tracker').classList.toggle('active', view === 'tracker');
      document.getElementById('view-prob').style.display = view === 'prob' ? 'block' : 'none';
      document.getElementById('view-tracker').style.display = view === 'tracker' ? 'block' : 'none';
      onSportChange();
    }

    async function init() {
      const selector = document.getElementById('sportSelect');
      try {
        const res = await fetch('./sports.json?t=' + Date.now());
        if (!res.ok) throw new Error('sports.json not found');
        sportsIndex = await res.json();

        selector.innerHTML = '';
        sportsIndex.forEach((item, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = item.name;
          selector.appendChild(opt);
        });

        document.getElementById('status').style.display = 'none';
        onSportChange();
      } catch (err) {
        showStatus(err.message + '. Ensure sports.json exists.', true);
      }
    }

    function onSportChange() {
      const selectedIdx = document.getElementById('sportSelect').value;
      if (!sportsIndex[selectedIdx]) return;
      const sport = sportsIndex[selectedIdx];

      if (currentView === 'prob') {
        loadProbabilities(sport.file);
      } else {
        loadTracker(sport.tracker);
      }
    }

    async function loadProbabilities(fileName) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:#94a3b8;">Loading predictions...</td></tr>';
      
      try {
        const res = await fetch('./' + fileName + '?t=' + Date.now());
        if (!res.ok) throw new Error('Could not load ' + fileName);
        const payload = await res.json();
        tbody.innerHTML = '';

        payload.data.forEach((row, i) => {
          const tr = document.createElement('tr');
          let badge = '';
          if (i === 0) badge = '<span class="badge badge-gold">🥇 1st</span>';
          else if (i === 1) badge = '<span class="badge badge-silver">🥈 2nd</span>';
          else if (i === 2) badge = '<span class="badge badge-bronze">🥉 3rd</span>';

          tr.innerHTML = `
            <td>${badge}<strong>${row.name}</strong></td>
            <td class="text-right gold">${row.gold}%</td>
            <td class="text-right silver">${row.silver}%</td>
            <td class="text-right bronze">${row.bronze}%</td>
            <td class="text-right"><strong>${row.total}%</strong></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171; padding:20px;">${err.message}</td></tr>`;
      }
    }

    async function loadTracker(trackerFile) {
      const container = document.getElementById('trackerList');
      if (!trackerFile) {
        container.innerHTML = '<div class="match-card" style="text-align:center; color:#94a3b8;">No match tracker configured for this sport.</div>';
        return;
      }
      container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:15px;">Loading matches...</div>';

      try {
        const res = await fetch('./' + trackerFile + '?t=' + Date.now());
        if (!res.ok) throw new Error('Could not load ' + trackerFile);
        const payload = await res.json();
        container.innerHTML = '';

        payload.matches.forEach(m => {
          let tagClass = 'tag-upcoming';
          if (m.status.toLowerCase() === 'live') tagClass = 'tag-live';
          if (m.status.toLowerCase() === 'finished') tagClass = 'tag-finished';

          const card = document.createElement('div');
          card.className = 'match-card';
          card.innerHTML = `
            <div class="match-header">
              <span>${m.round}</span>
              <span class="tag ${tagClass}">${m.status}</span>
            </div>
            <div class="match-team ${m.winner === m.player1 ? 'winner' : ''}">
              <span>${m.player1}</span>
              <span>${m.winner === m.player1 ? '✓' : ''}</span>
            </div>
            <div class="match-team ${m.winner === m.player2 ? 'winner' : ''}">
              <span>${m.player2}</span>
              <span>${m.winner === m.player2 ? '✓' : ''}</span>
            </div>
            <div class="match-score">Score: <strong>${m.score}</strong></div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<div class="match-card" style="color:#f87171;">${err.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
