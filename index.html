<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asian Games 2026 - Hub</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --win-color: #22c55e;
      --badge-live: #ef4444;
      --badge-finished: #475569;
      --badge-upcoming: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 14px 40px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Main Navigation */
    .main-nav {
      display: flex;
      background-color: #1e293b;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
    }

    .main-nav-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .main-nav-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* Dropdown Filters */
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .select-wrapper {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .select-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .custom-select {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
    }

    /* Card Layouts */
    .cards-list {
      display: grid;
      grid-gap: 12px;
    }

    .match-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .badge.finished { background: rgba(100, 116, 139, 0.3); color: #94a3b8; }
    .badge.live { background: rgba(239, 68, 68, 0.25); color: #f87171; }
    .badge.upcoming { background: rgba(59, 130, 246, 0.25); color: #60a5fa; }
    .badge.model { background: rgba(16, 185, 129, 0.2); color: #34d399; }

    .card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .team {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team.left { text-align: left; }
    .team.right { text-align: right; }
    .team.winner { color: var(--win-color); }

    .score-badge {
      background: #0b1120;
      border: 1px solid var(--card-border);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 800;
      margin: 0 10px;
      min-width: 80px;
      text-align: center;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 14px;
      font-size: 0.95rem;
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Asian Games 2026</h1>
    <p id="view-subtitle">Live Match Tracker</p>
  </header>

  <!-- Navigation -->
  <div class="main-nav">
    <button id="nav-tracker" class="main-nav-btn active" onclick="switchMainTab('tracker')">
      📊 Match Tracker
    </button>
    <button id="nav-predictions" class="main-nav-btn" onclick="switchMainTab('predictions')">
      🎯 Predictions
    </button>
  </div>

  <!-- Shared Dropdown Filters -->
  <div class="filter-grid">
    <div class="select-wrapper">
      <label class="select-label" for="select-sport">Sport</label>
      <select id="select-sport" class="custom-select" onchange="onSportChange()">
        <option value="basketball">🏀 Basketball</option>
      </select>
    </div>

    <div class="select-wrapper" id="wrapper-event">
      <label class="select-label" for="select-event">Division</label>
      <select id="select-event" class="custom-select" onchange="onEventChange()">
        <!-- Filled dynamically -->
      </select>
    </div>
  </div>

  <!-- Content Container -->
  <div id="content-cards" class="cards-list">
    <div class="empty-state">Loading data...</div>
  </div>

  <script>
    // Directory and file mappings per sport
    const SPORT_CONFIG = {
      basketball: {
        name: "Basketball",
        predictionsFile: "data/basketball/predictions.json",
        events: [
          { label: "Men's Tournament", file: "data/basketball/tracker_men.json" },
          { label: "Women's Tournament", file: "data/basketball/tracker_women.json" }
        ]
      }
    };

    let currentTab = 'tracker';

    function switchMainTab(tab) {
      currentTab = tab;
      const navTracker = document.getElementById('nav-tracker');
      const navPredictions = document.getElementById('nav-predictions');
      const subtitle = document.getElementById('view-subtitle');
      const eventWrapper = document.getElementById('wrapper-event');

      if (tab === 'predictions') {
        navPredictions.classList.add('active');
        navTracker.classList.remove('active');
        subtitle.innerText = 'Tournament Predictions & Win Probabilities';
        eventWrapper.style.display = 'none'; // Predictions are sport-wide
        loadCurrentView();
      } else {
        navTracker.classList.add('active');
        navPredictions.classList.remove('active');
        subtitle.innerText = 'Live Match Tracker';
        eventWrapper.style.display = 'flex';
        loadCurrentView();
      }
    }

    function onSportChange() {
      const sportKey = document.getElementById('select-sport').value;
      const eventSelect = document.getElementById('select-event');
      const config = SPORT_CONFIG[sportKey];

      eventSelect.innerHTML = '';
      if (config && config.events) {
        config.events.forEach((ev, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = ev.label;
          eventSelect.appendChild(opt);
        });
      }
      loadCurrentView();
    }

    function onEventChange() {
      if (currentTab === 'tracker') {
        loadCurrentView();
      }
    }

    function loadCurrentView() {
      const sportKey = document.getElementById('select-sport').value;
      const config = SPORT_CONFIG[sportKey];
      if (!config) return;

      if (currentTab === 'predictions') {
        loadPredictions(config.predictionsFile);
      } else {
        const eventIdx = document.getElementById('select-event').value || 0;
        const targetEvent = config.events[eventIdx];
        if (targetEvent) {
          loadMatches(targetEvent.file);
        }
      }
    }

    function loadPredictions(filePath) {
      const container = document.getElementById('content-cards');
      container.innerHTML = '<div class="empty-state">Loading predictions...</div>';

      fetch(filePath + '?_nocache=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          renderPredictions(data.predictions || []);
        })
        .catch(err => {
          container.innerHTML = `
            <div class="empty-state">
              No predictions file found at ${filePath}.
            </div>
          `;
        });
    }

    function renderPredictions(predictions) {
      const container = document.getElementById('content-cards');
      if (!predictions || predictions.length === 0) {
        container.innerHTML = '<div class="empty-state">No predictions published yet for this sport.</div>';
        return;
      }

      container.innerHTML = predictions.map(p => {
        const isT1Win = p.predicted_winner && (p.predicted_winner.toLowerCase() === p.team1.toLowerCase());
        const isT2Win = p.predicted_winner && (p.predicted_winner.toLowerCase() === p.team2.toLowerCase());

        return `
          <div class="match-card">
            <div class="card-header">
              <span>${p.match || 'Matchup'}</span>
              <span class="badge model">${p.confidence || 'Pick'}</span>
            </div>
            <div class="card-body">
              <span class="team left ${isT1Win ? 'winner' : ''}">${p.team1}</span>
              <span class="score-badge">${p.win_prob || 'vs'}</span>
              <span class="team right ${isT2Win ? 'winner' : ''}">${p.team2}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function loadMatches(filePath) {
      const container = document.getElementById('content-cards');
      container.innerHTML = '<div class="empty-state">Loading live fixtures...</div>';

      fetch(filePath + '?_nocache=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          renderMatches(data.matches || []);
        })
        .catch(err => {
          container.innerHTML = `<div class="empty-state">No fixtures loaded for this division.</div>`;
        });
    }

    function renderMatches(matches) {
      const container = document.getElementById('content-cards');
      if (!matches || matches.length === 0) {
        container.innerHTML = '<div class="empty-state">No matches scheduled.</div>';
        return;
      }

      container.innerHTML = matches.map(m => {
        const isP1Win = m.winner && (m.winner.trim().toLowerCase() === m.player1.trim().toLowerCase());
        const isP2Win = m.winner && (m.winner.trim().toLowerCase() === m.player2.trim().toLowerCase());
        const statusClass = (m.status || 'upcoming').toLowerCase();

        return `
          <div class="match-card">
            <div class="card-header">
              <span>${m.round || 'Match'}</span>
              <span class="badge ${statusClass}">${m.status}</span>
            </div>
            <div class="card-body">
              <span class="team left ${isP1Win ? 'winner' : ''}">${m.player1}</span>
              <span class="score-badge">${m.score}</span>
              <span class="team right ${isP2Win ? 'winner' : ''}">${m.player2}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Initialize UI on page load
    onSportChange();
  </script>
</body>
</html>
