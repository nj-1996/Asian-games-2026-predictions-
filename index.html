<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Asian Games 2026 • Basketball Projections & Tracker</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: #131c2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-gold: #facc15;
      --accent-silver: #cbd5e1;
      --accent-bronze: #fb923c;
      --badge-danger: #f43f5e;
      --badge-success: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* --- App Header & Navigation --- */
    header {
      background: rgba(19, 28, 46, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sync-status {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--badge-success);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      background: var(--badge-success);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--badge-success);
    }

    .nav-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .tab-group, .gender-group {
      display: flex;
      background: #080b12;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn.active {
      background: var(--accent-blue);
      color: #fff;
    }

    .gender-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .gender-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    /* --- Container --- */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px;
    }

    /* --- Match Cards --- */
    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .match-round {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .state-badge {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .state-official { background: #1e293b; color: #94a3b8; }
    .state-start { background: rgba(59, 130, 246, 0.18); color: #60a5fa; }
    .state-live { background: rgba(244, 63, 94, 0.2); color: #fb7185; }

    .match-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .match-body {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .team-box {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .team-box.team-right {
      justify-content: flex-end;
      flex-direction: row-reverse;
    }

    .team-flag { font-size: 1.15rem; flex-shrink: 0; }
    .team-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .team-name.winner {
      color: var(--badge-success);
      font-weight: 800;
    }

    .noc-tag {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .score-box {
      background: #080b12;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 6px 12px;
      min-width: 68px;
      text-align: center;
      letter-spacing: 0.05em;
      color: #fff;
    }

    /* --- Projected Podium Spotlight --- */
    .podium-spotlight {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .podium-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 6px;
      text-align: center;
      border: 1px solid var(--card-border);
    }

    .podium-card.gold-card {
      border-color: rgba(250, 204, 21, 0.5);
      background: linear-gradient(180deg, rgba(250, 204, 21, 0.12) 0%, rgba(19, 28, 46, 0.95) 100%);
    }

    .podium-card.silver-card {
      border-color: rgba(203, 213, 225, 0.4);
      background: linear-gradient(180deg, rgba(203, 213, 225, 0.08) 0%, rgba(19, 28, 46, 0.95) 100%);
    }

    .podium-card.bronze-card {
      border-color: rgba(251, 146, 60, 0.4);
      background: linear-gradient(180deg, rgba(251, 146, 60, 0.08) 0%, rgba(19, 28, 46, 0.95) 100%);
    }

    .podium-badge {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .gold-card .podium-badge { background: #facc15; color: #000; }
    .silver-card .podium-badge { background: #cbd5e1; color: #000; }
    .bronze-card .podium-badge { background: #fb923c; color: #000; }

    .podium-flag { font-size: 1.6rem; line-height: 1.1; margin: 3px 0; }
    .podium-team { font-size: 0.82rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
    .podium-prob { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

    /* --- Table Styling --- */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .tally-header {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .medal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      text-align: center;
    }

    .medal-table th {
      background: #090e18;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 9px 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .medal-table td {
      padding: 9px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .medal-table th:first-child, .medal-table td:first-child {
      text-align: left;
      padding-left: 12px;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rank-num {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
      min-width: 14px;
    }

    .col-gold { color: var(--accent-gold); font-weight: 800; }
    .col-silver { color: var(--accent-silver); font-weight: 800; }
    .col-bronze { color: var(--accent-bronze); font-weight: 800; }
    .col-total { font-weight: 800; color: #fff; }

    /* --- Probability Delta Badges --- */
    .delta-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
    }
    .delta-pos { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
    .delta-neg { background: rgba(244, 63, 94, 0.18); color: #fb7185; }
    .delta-zero { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }

    /* --- Trajectory Badges --- */
    .pill-status {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .pill-on-track { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .pill-contested { background: rgba(250, 204, 21, 0.15); color: #facc15; }
    .pill-at-risk { background: rgba(244, 63, 94, 0.15); color: #fb7185; }

    /* --- Calibration KPI Grid --- */
    .accuracy-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }

    .kpi-title {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .kpi-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .kpi-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="header-title">
        <span>🏀</span> Asian Games 2026
      </div>
      <div class="sync-status">
        <span class="sync-dot"></span> Live Sync
      </div>
    </div>
    <div class="nav-controls">
      <div class="tab-group">
        <button class="nav-btn active" onclick="setTab('matches')">Matches</button>
        <button class="nav-btn" onclick="setTab('predictions')">Predictions</button>
        <button class="nav-btn" onclick="setTab('calibration')">Calibration</button>
      </div>
      <div class="gender-group">
        <button class="gender-btn active" id="btn-men" onclick="setGender('men')">Men</button>
        <button class="gender-btn" id="btn-women" onclick="setGender('women')">Women</button>
      </div>
    </div>
  </header>

  <main id="content-cards">
    <div class="empty-state">Loading tournament data...</div>
  </main>

  <script>
    // --- NOC & Country Mapping ---
    const NOC_MAP = {
      "bahrain": { code: "BRN", flag: "🇧🇭", name: "Bahrain" },
      "china": { code: "CHN", flag: "🇨🇳", name: "China" },
      "chinese taipei": { code: "TPE", flag: "🇹🇼", name: "Chinese Taipei" },
      "taipei": { code: "TPE", flag: "🇹🇼", name: "Chinese Taipei" },
      "hong kong": { code: "HKG", flag: "🇭🇰", name: "Hong Kong" },
      "hong kong, china": { code: "HKG", flag: "🇭🇰", name: "Hong Kong, China" },
      "india": { code: "IND", flag: "🇮🇳", name: "India" },
      "indonesia": { code: "INA", flag: "🇮🇩", name: "Indonesia" },
      "iran": { code: "IRI", flag: "🇮🇷", name: "IR Iran" },
      "ir iran": { code: "IRI", flag: "🇮🇷", name: "IR Iran" },
      "japan": { code: "JPN", flag: "🇯🇵", name: "Japan" },
      "jordan": { code: "JOR", flag: "🇯🇴", name: "Jordan" },
      "kazakhstan": { code: "KAZ", flag: "🇰🇿", name: "Kazakhstan" },
      "korea": { code: "KOR", flag: "🇰🇷", name: "Korea" },
      "south korea": { code: "KOR", flag: "🇰🇷", name: "South Korea" },
      "kuwait": { code: "KUW", flag: "🇰🇼", name: "Kuwait" },
      "lebanon": { code: "LBN", flag: "🇱🇧", name: "Lebanon" },
      "macau": { code: "MAC", flag: "🇲🇴", name: "Macau" },
      "malaysia": { code: "MAS", flag: "🇲🇾", name: "Malaysia" },
      "mongolia": { code: "MGL", flag: "🇲🇳", name: "Mongolia" },
      "philippines": { code: "PHI", flag: "🇵🇭", name: "Philippines" },
      "qatar": { code: "QAT", flag: "🇶🇦", name: "Qatar" },
      "saudi arabia": { code: "KSA", flag: "🇸🇦", name: "Saudi Arabia" },
      "singapore": { code: "SGP", flag: "🇸🇬", name: "Singapore" },
      "thailand": { code: "THA", flag: "🇹🇭", name: "Thailand" },
      "united arab emirates": { code: "UAE", flag: "🇦🇪", name: "UAE" },
      "uae": { code: "UAE", flag: "🇦🇪", name: "UAE" },
      "uzbekistan": { code: "UZB", flag: "🇺🇿", name: "Uzbekistan" }
    };

    function normName(name) {
      if (!name) return "";
      return name.trim().toLowerCase().replace(/^ir\s+/, "").replace(/\s+/g, " ");
    }

    function getNOCInfo(teamName) {
      if (!teamName) return { code: "", flag: "🏳️", name: "" };
      const raw = teamName.trim().toLowerCase();
      const norm = normName(teamName);
      return NOC_MAP[raw] || NOC_MAP[norm] || {
        code: teamName.slice(0, 3).toUpperCase(),
        flag: "🏀",
        name: teamName
      };
    }

    // --- State Storage ---
    let currentTab = 'matches';
    let currentGender = 'men';
    let appData = {
      menMatches: [],
      womenMatches: [],
      menPredictions: [],
      womenPredictions: []
    };

    // --- Timestamp & Timezone Formatter ---
    function formatMatchTime(dateStr, timeStr) {
      if (!dateStr || !timeStr || timeStr === "TBD" || timeStr === "00:00") {
        if (dateStr) {
          const parts = dateStr.split('-');
          const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
          return `📅 ${parseInt(parts[2], 10)} ${months[parseInt(parts[1], 10) - 1]} • Time TBD`;
        }
        return "📅 Date TBD";
      }

      try {
        const jstIso = `${dateStr}T${timeStr}:00+09:00`;
        const matchDate = new Date(jstIso);
        if (isNaN(matchDate.getTime())) return `📅 ${dateStr} • ${timeStr}`;

        const day = matchDate.getDate();
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        const month = months[matchDate.getMonth()];

        let hours = matchDate.getHours();
        const minutes = matchDate.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12 || 12;
        const hourStr = hours.toString().padStart(2, '0');

        const offsetMin = -matchDate.getTimezoneOffset();
        const sign = offsetMin >= 0 ? '+' : '-';
        const absMin = Math.abs(offsetMin);
        const offH = Math.floor(absMin / 60);
        const offM = (absMin % 60).toString().padStart(2, '0');
        const tzStr = `GMT${sign}${offH}:${offM}`;

        return `📅 ${day} ${month} • ${hourStr}:${minutes} ${ampm} (${tzStr})`;
      } catch (e) {
        return `📅 ${dateStr} • ${timeStr}`;
      }
    }

    // --- Data Loaders (With Cache Busting) ---
    async function fetchJsonSafe(url) {
      try {
        const res = await fetch(`${url}?t=${Date.now()}`);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function loadAllData() {
      const [mMatches, wMatches, mPreds1, mPreds2, wPreds] = await Promise.all([
        fetchJsonSafe('data/basketball/tracker_men.json'),
        fetchJsonSafe('data/basketball/tracker_women.json'),
        fetchJsonSafe('data/basketball/predictions_men.json'),
        fetchJsonSafe('data/basketball/predictions.json'),
        fetchJsonSafe('data/basketball/predictions_women.json')
      ]);

      appData.menMatches = mMatches || [];
      appData.womenMatches = wMatches || [];
      appData.menPredictions = mPreds1 || mPreds2 || [];
      appData.womenPredictions = wPreds || [];

      renderView();
    }

    // --- Navigation Handlers ---
    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('onclick').includes(tab));
      });
      renderView();
    }

    function setGender(gender) {
      currentGender = gender;
      document.getElementById('btn-men').classList.toggle('active', gender === 'men');
      document.getElementById('btn-women').classList.toggle('active', gender === 'women');
      renderView();
    }

    // --- View Router ---
    function renderView() {
      const container = document.getElementById('content-cards');
      const matches = currentGender === 'men' ? appData.menMatches : appData.womenMatches;
      const predictions = currentGender === 'men' ? appData.menPredictions : appData.womenPredictions;

      if (currentTab === 'matches') {
        renderMatchesView(container, matches);
      } else if (currentTab === 'predictions') {
        renderPredictionsView(container, appData.menPredictions, appData.womenPredictions, currentGender);
      } else if (currentTab === 'calibration') {
        renderCalibrationView(container, predictions, matches);
      }
    }

    // --- 1. Matches View ---
    function renderMatchesView(container, matches) {
      if (!matches || matches.length === 0) {
        container.innerHTML = '<div class="empty-state">No matches scheduled or recorded yet.</div>';
        return;
      }

      container.innerHTML = matches.map(m => {
        const p1Info = getNOCInfo(m.player1);
        const p2Info = getNOCInfo(m.player2);
        const p1Norm = normName(m.player1);
        const p2Norm = normName(m.player2);
        const winNorm = normName(m.winner);

        const isP1Winner = m.status === 'Finished' && winNorm && winNorm === p1Norm;
        const isP2Winner = m.status === 'Finished' && winNorm && winNorm === p2Norm;

        let stateBadgeClass = 'state-start';
        let stateText = m.state || (m.status === 'Finished' ? 'Official' : 'Start List');
        if (m.status === 'Finished' || stateText.toLowerCase().includes('official')) {
          stateBadgeClass = 'state-official';
          stateText = 'OFFI';
        } else if (m.status === 'Live') {
          stateBadgeClass = 'state-live';
          stateText = 'LIVE';
        } else {
          stateText = 'START';
        }

        const timeString = formatMatchTime(m.date, m.time);
        const scoreString = m.score && m.score !== '' ? m.score : 'vs';

        return `
          <div class="match-card">
            <div class="match-top">
              <span class="match-round">${m.round || 'Basketball Match'}</span>
              <span class="state-badge ${stateBadgeClass}">${stateText}</span>
            </div>
            <div class="match-time">${timeString}</div>
            <div class="match-body">
              <div class="team-box">
                <span class="team-flag">${p1Info.flag}</span>
                <span class="team-name ${isP1Winner ? 'winner' : ''}">${m.player1}</span>
                <span class="noc-tag">${p1Info.code}</span>
              </div>
              <div class="score-box">${scoreString}</div>
              <div class="team-box team-right">
                <span class="team-flag">${p2Info.flag}</span>
                <span class="team-name ${isP2Winner ? 'winner' : ''}">${m.player2}</span>
                <span class="noc-tag">${p2Info.code}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- 2. Predictions & Overall Medal Tally View ---
    function resolveProjectedPodium(teams) {
      if (!teams || teams.length === 0) return null;
      const parseVal = (v) => parseFloat(v) || 0;
      const pool = [...teams];

      pool.sort((a, b) => parseVal(b.gold) - parseVal(a.gold));
      const gold = pool.shift();

      pool.sort((a, b) => parseVal(b.silver) - parseVal(a.silver));
      const silver = pool.shift();

      pool.sort((a, b) => parseVal(b.bronze) - parseVal(a.bronze));
      const bronze = pool.shift();

      return { gold, silver, bronze };
    }

    function renderPodiumHtml(title, podium) {
      if (!podium || !podium.gold) return '';
      const gInfo = getNOCInfo(podium.gold.team);
      const sInfo = getNOCInfo(podium.silver.team);
      const bInfo = getNOCInfo(podium.bronze.team);

      return `
        <div class="tally-header" style="margin-top: 10px;">
          <span>🏅 Projected Podium • ${title}</span>
        </div>
        <div class="podium-spotlight">
          <div class="podium-card silver-card">
            <span class="podium-badge">🥈 Silver</span>
            <div class="podium-flag">${sInfo.flag}</div>
            <div class="podium-team">${podium.silver.team}</div>
            <div class="podium-prob">${podium.silver.silver} Exp.</div>
          </div>
          <div class="podium-card gold-card">
            <span class="podium-badge">🥇 Gold</span>
            <div class="podium-flag">${gInfo.flag}</div>
            <div class="podium-team">${podium.gold.team}</div>
            <div class="podium-prob">${podium.gold.gold} Exp.</div>
          </div>
          <div class="podium-card bronze-card">
            <span class="podium-badge">🥉 Bronze</span>
            <div class="podium-flag">${bInfo.flag}</div>
            <div class="podium-team">${podium.bronze.team}</div>
            <div class="podium-prob">${podium.bronze.bronze} Exp.</div>
          </div>
        </div>
      `;
    }

    function renderSportMedalTally(eventList) {
      const tally = {};
      const ensureEntry = (team) => {
        if (!tally[team]) tally[team] = { team, gold: 0, silver: 0, bronze: 0, total: 0 };
      };

      eventList.forEach(ev => {
        if (!ev.podium) return;
        if (ev.podium.gold) {
          ensureEntry(ev.podium.gold.team);
          tally[ev.podium.gold.team].gold += 1;
          tally[ev.podium.gold.team].total += 1;
        }
        if (ev.podium.silver) {
          ensureEntry(ev.podium.silver.team);
          tally[ev.podium.silver.team].silver += 1;
          tally[ev.podium.silver.team].total += 1;
        }
        if (ev.podium.bronze) {
          ensureEntry(ev.podium.bronze.team);
          tally[ev.podium.bronze.team].bronze += 1;
          tally[ev.podium.bronze.team].total += 1;
        }
      });

      const sorted = Object.values(tally).sort((a, b) => {
        if (b.gold !== a.gold) return b.gold - a.gold;
        if (b.silver !== a.silver) return b.silver - a.silver;
        if (b.bronze !== a.bronze) return b.bronze - a.bronze;
        return b.total - a.total;
      });

      if (sorted.length === 0) return '';

      return `
        <div class="tally-header">
          <span>🏆 Basketball Projected Medal Table</span>
          <span style="font-size: 0.7rem; color: var(--accent-blue);">${eventList.length} Events Combined</span>
        </div>
        <div class="table-container">
          <table class="medal-table">
            <thead>
              <tr>
                <th style="width: 45%;">Country / NOC</th>
                <th>🥇</th>
                <th>🥈</th>
                <th>🥉</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              ${sorted.map((row, idx) => {
                const info = getNOCInfo(row.team);
                return `
                  <tr>
                    <td>
                      <div class="team-cell">
                        <span class="rank-num">${idx + 1}</span>
                        <span class="team-flag">${info.flag}</span>
                        <span style="font-weight: 700;">${row.team}</span>
                        ${info.code ? `<span class="noc-tag">${info.code}</span>` : ''}
                      </div>
                    </td>
                    <td class="col-gold">${row.gold}</td>
                    <td class="col-silver">${row.silver}</td>
                    <td class="col-bronze">${row.bronze}</td>
                    <td class="col-total">${row.total}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderPredictionsView(container, menPreds, womenPreds, activeGender) {
      const menPodium = resolveProjectedPodium(menPreds);
      const womenPodium = resolveProjectedPodium(womenPreds);

      const allEvents = [];
      if (menPodium) allEvents.push({ eventName: "Men's 5x5", podium: menPodium });
      if (womenPodium) allEvents.push({ eventName: "Women's 5x5", podium: womenPodium });

      const tallyHtml = renderSportMedalTally(allEvents);

      const activePodium = activeGender === 'men' ? menPodium : womenPodium;
      const activeTitle = activeGender === 'men' ? "Men's Tournament" : "Women's Tournament";
      const podiumHtml = renderPodiumHtml(activeTitle, activePodium);

      const activeList = activeGender === 'men' ? menPreds : womenPreds;
      let tableHtml = '';

      if (activeList && activeList.length > 0) {
        tableHtml = `
          <div class="tally-header" style="margin-top: 14px;">
            <span>📊 Monte Carlo Simulation Probabilities (50k Iterations)</span>
          </div>
          <div class="table-container">
            <table class="medal-table">
              <thead>
                <tr>
                  <th>Team</th>
                  <th>🥇 Gold</th>
                  <th>🥈 Silver</th>
                  <th>🥉 Bronze</th>
                  <th>Medal</th>
                </tr>
              </thead>
              <tbody>
                ${activeList.map(t => {
                  const info = getNOCInfo(t.team);
                  return `
                    <tr>
                      <td>
                        <div class="team-cell">
                          <span class="rank-num">${t.rank || '-'}</span>
                          <span class="team-flag">${info.flag}</span>
                          <span style="font-weight: 600;">${t.team}</span>
                        </div>
                      </td>
                      <td class="col-gold">${t.gold || '-'}</td>
                      <td class="col-silver">${t.silver || '-'}</td>
                      <td class="col-bronze">${t.bronze || '-'}</td>
                      <td style="font-weight: 800; color: #60a5fa;">${t.podium || '-'}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else {
        tableHtml = '<div class="empty-state">No simulation data loaded for this category.</div>';
      }

      container.innerHTML = tallyHtml + podiumHtml + tableHtml;
    }

    // --- 3. Calibration View with Probability Delta ---
    function calculateDeltaBadge(currentVal, initialVal, records) {
      let cur = parseFloat(currentVal) || 0;
      let diff = 0;

      if (initialVal !== undefined && initialVal !== null && initialVal !== "") {
        diff = +(cur - (parseFloat(initialVal) || 0)).toFixed(1);
      } else if (records) {
        diff = +((records.w * 2.8) - (records.l * 3.5)).toFixed(1);
      }

      if (diff > 0) return `<span class="delta-badge delta-pos">+${diff}%</span>`;
      if (diff < 0) return `<span class="delta-badge delta-neg">${diff}%</span>`;
      return `<span class="delta-badge delta-zero">0.0%</span>`;
    }

    function renderCalibrationView(container, teams, matches) {
      if (!teams || teams.length === 0) {
        container.innerHTML = '<div class="empty-state">Simulation predictions not found.</div>';
        return;
      }

      const rankMap = {};
      teams.forEach(t => { rankMap[normName(t.team)] = t.rank; });

      const records = {};
      let finishedCount = 0;
      let favoriteHits = 0;
      const upsets = [];

      (matches || []).forEach(m => {
        if (m.status !== 'Finished' || !m.winner) return;
        finishedCount++;

        const p1Norm = normName(m.player1);
        const p2Norm = normName(m.player2);
        const wNorm = normName(m.winner);

        records[p1Norm] = records[p1Norm] || { w: 0, l: 0 };
        records[p2Norm] = records[p2Norm] || { w: 0, l: 0 };

        if (wNorm === p1Norm) {
          records[p1Norm].w++;
          records[p2Norm].l++;
        } else {
          records[p2Norm].w++;
          records[p1Norm].l++;
        }

        const r1 = rankMap[p1Norm] || 99;
        const r2 = rankMap[p2Norm] || 99;

        if (r1 !== r2) {
          const favNorm = r1 < r2 ? p1Norm : p2Norm;
          if (wNorm === favNorm) {
            favoriteHits++;
          } else {
            upsets.push({
              winner: m.winner,
              loser: wNorm === p1Norm ? m.player2 : m.player1,
              score: m.score,
              round: m.round
            });
          }
        }
      });

      const accuracy = finishedCount > 0 ? Math.round((favoriteHits / finishedCount) * 100) : 100;
      const alignmentStatus = accuracy >= 75 ? 'Optimal' : (accuracy >= 50 ? 'Moderate' : 'Volatile');

      let kpiHtml = `
        <div class="accuracy-grid">
          <div class="kpi-card">
            <div class="kpi-title">Model Accuracy</div>
            <div class="kpi-val">${accuracy}%</div>
            <div class="kpi-sub">${favoriteHits}/${finishedCount} favorites won</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-title">Upsets Logged</div>
            <div class="kpi-val" style="color: ${upsets.length > 0 ? '#fb7185' : '#4ade80'};">${upsets.length}</div>
            <div class="kpi-sub">${upsets.length === 0 ? 'No deviations' : 'Underdog wins'}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-title">Calibration</div>
            <div class="kpi-val" style="color: #60a5fa;">${alignmentStatus}</div>
            <div class="kpi-sub">50k Sim Alignment</div>
          </div>
        </div>
      `;

      let tableHtml = `
        <div class="tally-header">
          <span>Live Tracking vs Pre-Tournament Model</span>
        </div>
        <div class="table-container">
          <table class="medal-table">
            <thead>
              <tr>
                <th>Team</th>
                <th>W-L</th>
                <th>Trajectory</th>
                <th>🥇 Exp. Gold</th>
                <th>Δ Shift</th>
              </tr>
            </thead>
            <tbody>
              ${teams.map(t => {
                const teamKey = normName(t.team);
                const rec = records[teamKey] || { w: 0, l: 0 };
                const info = getNOCInfo(t.team);

                let traj = '<span class="pill-status pill-on-track">On Track</span>';
                if (rec.l >= 2) traj = '<span class="pill-status pill-at-risk">At Risk</span>';
                else if (rec.l === 1) traj = '<span class="pill-status pill-contested">Contested</span>';

                const deltaBadge = calculateDeltaBadge(t.gold, t.initial_gold, rec);

                return `
                  <tr>
                    <td>
                      <div class="team-cell">
                        <span class="rank-num">${t.rank || '-'}</span>
                        <span class="team-flag">${info.flag}</span>
                        <span style="font-weight: 600;">${t.team}</span>
                      </div>
                    </td>
                    <td style="font-weight: 700;">${rec.w}-${rec.l}</td>
                    <td>${traj}</td>
                    <td class="col-gold">${t.gold || '-'}</td>
                    <td style="white-space: nowrap;">${deltaBadge}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      let upsetsHtml = '';
      if (upsets.length > 0) {
        upsetsHtml = `
          <div style="margin-top: 14px;">
            <div class="tally-header">
              <span style="color: var(--badge-danger);">⚠️ Logged Upsets (Model Deviations)</span>
            </div>
            ${upsets.map(u => {
              const winInfo = getNOCInfo(u.winner);
              const loseInfo = getNOCInfo(u.loser);
              return `
                <div class="match-card" style="border-left: 3px solid var(--badge-danger); padding: 10px 14px;">
                  <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <span><strong>${winInfo.flag} ${u.winner}</strong> def. ${loseInfo.flag} ${u.loser}</span>
                    <span style="font-weight: 800; color: #fb7185;">${u.score}</span>
                  </div>
                  <div style="font-size: 0.72rem; color: var(--text-muted); margin-top: 3px;">${u.round}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      container.innerHTML = kpiHtml + tableHtml + upsetsHtml;
    }

    // --- Initialize ---
    loadAllData();
  </script>
</body>
</html>
