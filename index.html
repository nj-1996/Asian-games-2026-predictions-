<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Asian Games 2026 • Basketball Projections & Tracker</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>

  <header>
    <div class="header-top">
      <div class="header-title">
        <span>🏀</span> Asian Games 2026
      </div>
      <div class="sync-status">
        <span class="sync-dot"></span> Live Sync
      </div>
    </div>
    <div class="nav-controls">
      <div class="tab-group">
        <button class="nav-btn active" id="tab-matches" onclick="setTab('matches')">Matches</button>
        <button class="nav-btn" id="tab-predictions" onclick="setTab('predictions')">Predictions</button>
        <button class="nav-btn" id="tab-calibration" onclick="setTab('calibration')">Calibration</button>
      </div>
      <div class="gender-group">
        <button class="gender-btn active" id="btn-men" onclick="setGender('men')">Men</button>
        <button class="gender-btn" id="btn-women" onclick="setGender('women')">Women</button>
      </div>
    </div>
  </header>

  <main id="content-cards">
    <div class="empty-state">Loading tournament data...</div>
  </main>

  <!-- Modular Scripts with Cache-Busting -->
  <script src="js/core.js?v=3"></script>
  <script src="js/sports/basketball.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
