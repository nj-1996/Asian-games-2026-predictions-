<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asian Games 2026 - Hub</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --win-color: #22c55e;
      --gold: #f59e0b;
      --silver: #cbd5e1;
      --bronze: #d97706;
      --badge-live: #ef4444;
      --badge-finished: #475569;
      --badge-upcoming: #3b82f6;
      --badge-danger: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 14px 40px;
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* 3-Tab Main Navigation */
    .main-nav {
      display: flex;
      background-color: #1e293b;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
      gap: 4px;
    }

    .main-nav-btn {
      flex: 1;
      padding: 9px 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.82rem;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .main-nav-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* Filters */
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .select-wrapper {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .select-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .custom-select {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      width: 100%;
    }

    /* Cards & Layout */
    .cards-list {
      display: grid;
      grid-gap: 12px;
    }

    .match-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .match-round {
      font-weight: 700;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .match-datetime {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Status Badges & Pulsing LIVE Dot */
    .badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .badge.finished { background: rgba(100, 116, 139, 0.3); color: #94a3b8; }
    .badge.upcoming { background: rgba(59, 130, 246, 0.25); color: #60a5fa; }
    .badge.model { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge.danger { background: rgba(244, 63, 94, 0.25); color: #fb7185; }

    .badge.live {
      background: rgba(239, 68, 68, 0.22);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .live-pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      animation: pulse-dot 1.4s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0% {
        transform: scale(0.9);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      70% {
        transform: scale(1.15);
        box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
      }
      100% {
        transform: scale(0.9);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    /* Match Card Body */
    .card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .team {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .team.left { justify-content: flex-start; text-align: left; }
    .team.right { justify-content: flex-end; text-align: right; }
    .team.winner { color: var(--win-color); font-weight: 700; }

    .team-flag {
      font-size: 1.15rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .team-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .noc-tag {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .score-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 8px;
      flex-shrink: 0;
    }

    .score-badge {
      background: #0b1120;
      border: 1px solid var(--card-border);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 800;
      min-width: 76px;
      text-align: center;
    }

    /* Table Styles */
    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    .medal-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    .medal-table th {
      padding: 12px 14px;
      background: #0f172a;
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }

    .medal-table td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      font-weight: 600;
    }

    .medal-table tr:last-child td {
      border-bottom: none;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .rank-num {
      color: var(--text-muted);
      font-size: 0.75rem;
      width: 14px;
      flex-shrink: 0;
    }

    /* Inline Probability Bars */
    .prob-cell {
      min-width: 72px;
    }

    .prob-val {
      display: block;
      font-size: 0.84rem;
      margin-bottom: 4px;
    }

    .prob-bar-track {
      width: 100%;
      max-width: 60px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .prob-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .prob-bar-fill.gold { background: var(--gold); }
    .prob-bar-fill.silver { background: var(--silver); }
    .prob-bar-fill.bronze { background: var(--bronze); }
    .prob-bar-fill.podium { background: var(--win-color); }

    .gold-cell { color: var(--gold); }
    .silver-cell { color: var(--silver); }
    .bronze-cell { color: var(--bronze); }
    .podium-cell { color: var(--win-color); }

    /* Calibration Styles */
    .accuracy-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }

    .kpi-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .kpi-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--win-color);
    }

    .kpi-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .pill-status {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .pill-on-track { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .pill-contested { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .pill-at-risk { background: rgba(244, 63, 94, 0.2); color: #fb7185; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 14px;
      font-size: 0.95rem;
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Asian Games 2026</h1>
    <p id="view-subtitle">Live Match Tracker</p>
  </header>

  <div class="main-nav">
    <button id="nav-tracker" class="main-nav-btn active" onclick="switchMainTab('tracker')">
      📊 Tracker
    </button>
    <button id="nav-predictions" class="main-nav-btn" onclick="switchMainTab('predictions')">
      🎯 Predictions
    </button>
    <button id="nav-calibration" class="main-nav-btn" onclick="switchMainTab('calibration')">
      📈 Calibration
    </button>
  </div>

  <div class="filter-grid">
    <div class="select-wrapper">
      <label class="select-label" for="select-sport">Sport</label>
      <select id="select-sport" class="custom-select" onchange="onSportChange()">
        <option value="basketball">🏀 Basketball</option>
      </select>
    </div>

    <div class="select-wrapper" id="wrapper-event">
      <label class="select-label" for="select-event">Division</label>
      <select id="select-event" class="custom-select" onchange="onEventChange()">
        <option value="men">Men's Tournament</option>
        <option value="women">Women's Tournament</option>
      </select>
    </div>
  </div>

  <div id="content-cards" class="cards-list">
    <div class="empty-state">Loading data...</div>
  </div>

  <script>
    const SPORT_CONFIG = {
      basketball: {
        name: "Basketball",
        predictionsFile: "data/basketball/predictions.json",
        trackerFiles: {
          men: "data/basketball/tracker_men.json",
          women: "data/basketball/tracker_women.json"
        }
      }
    };

    const NOC_REGISTRY = {
      'china': { flag: '🇨🇳', code: 'CHN' },
      'japan': { flag: '🇯🇵', code: 'JPN' },
      'philippines': { flag: '🇵🇭', code: 'PHI' },
      'republic of korea': { flag: '🇰🇷', code: 'KOR' },
      'korea': { flag: '🇰🇷', code: 'KOR' },
      'jordan': { flag: '🇯🇴', code: 'JOR' },
      'chinese taipei': { flag: '🇹🇼', code: 'TPE' },
      'ir iran': { flag: '🇮🇷', code: 'IRI' },
      'iran': { flag: '🇮🇷', code: 'IRI' },
      'india': { flag: '🇮🇳', code: 'IND' },
      'kazakhstan': { flag: '🇰🇿', code: 'KAZ' },
      'saudi arabia': { flag: '🇸🇦', code: 'KSA' },
      'hong kong': { flag: '🇭🇰', code: 'HKG' },
      'thailand': { flag: '🇹🇭', code: 'THA' },
      'indonesia': { flag: '🇮🇩', code: 'INA' },
      'mongolia': { flag: '🇲🇳', code: 'MGL' },
      'qatar': { flag: '🇶🇦', code: 'QAT' },
      'bahrain': { flag: '🇧🇭', code: 'BRN' },
      'lebanon': { flag: '🇱🇧', code: 'LBN' }
    };

    let currentTab = 'tracker';

    function switchMainTab(tab) {
      currentTab = tab;
      const navTracker = document.getElementById('nav-tracker');
      const navPredictions = document.getElementById('nav-predictions');
      const navCalibration = document.getElementById('nav-calibration');
      const subtitle = document.getElementById('view-subtitle');

      navTracker.classList.remove('active');
      navPredictions.classList.remove('active');
      navCalibration.classList.remove('active');

      if (tab === 'predictions') {
        navPredictions.classList.add('active');
        subtitle.innerText = 'Monte Carlo Medal Projections (50,000 Iterations)';
      } else if (tab === 'calibration') {
        navCalibration.classList.add('active');
        subtitle.innerText = 'Live Model Calibration & Performance Accuracy';
      } else {
        navTracker.classList.add('active');
        subtitle.innerText = 'Live Match Tracker';
      }

      loadCurrentView();
    }

    function onSportChange() { loadCurrentView(); }
    function onEventChange() { loadCurrentView(); }

    function loadCurrentView() {
      const sportKey = document.getElementById('select-sport').value;
      const divisionKey = document.getElementById('select-event').value;
      const config = SPORT_CONFIG[sportKey];
      if (!config) return;

      if (currentTab === 'predictions') {
        loadMedalPredictions(config.predictionsFile, divisionKey);
      } else if (currentTab === 'calibration') {
        loadCalibration(config.predictionsFile, config.trackerFiles[divisionKey], divisionKey);
      } else {
        const filePath = config.trackerFiles[divisionKey];
        if (filePath) loadMatches(filePath);
      }
    }

  function normName(name) {
  return (name || '')
    .toLowerCase()
    .replace(/\s*\(host\)/g, '')
    .replace(/\b(republic of|ir)\b/g, '')
    .replace(/\./g, '')
    .trim();
    }
    
    

    function getNOCInfo(rawName) {
      const clean = normName(rawName);
      return NOC_REGISTRY[clean] || { flag: '🌐', code: '' };
    }

    function renderTeamBadge(name, isRight = false) {
      if (!name) return 'TBD';
      const info = getNOCInfo(name);
      const flagSpan = `<span class="team-flag">${info.flag}</span>`;
      const nameSpan = `<span class="team-name-text">${name}</span>`;
      const codeSpan = info.code ? `<span class="noc-tag">${info.code}</span>` : '';

      if (isRight) {
        return `${codeSpan} ${nameSpan} ${flagSpan}`;
      }
      return `${flagSpan} ${nameSpan} ${codeSpan}`;
    }

    function renderProbCell(valStr, colorClass) {
      const numericVal = parseFloat(valStr) || 0;
      return `
        <td class="prob-cell ${colorClass}-cell">
          <span class="prob-val">${valStr}</span>
          <div class="prob-bar-track">
            <div class="prob-bar-fill ${colorClass}" style="width: ${Math.min(100, numericVal)}%;"></div>
          </div>
        </td>
      `;
    }

    // ==========================================
    // 1. PREDICTIONS TAB
    // ==========================================
    function loadMedalPredictions(filePath, division) {
      const container = document.getElementById('content-cards');
      container.innerHTML = '<div class="empty-state">Loading simulation results...</div>';

      fetch(filePath + '?_nocache=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          const list = (division === 'women') ? data.women : data.men;
          renderMedalTable(list, data);
        })
        .catch(err => {
          container.innerHTML = `<div class="empty-state">No predictions file found at ${filePath}.</div>`;
        });
    }

    function renderMedalTable(teams, meta) {
      const container = document.getElementById('content-cards');
      if (!teams || teams.length === 0) {
        container.innerHTML = '<div class="empty-state">No simulation data available.</div>';
        return;
      }

      let metaHeader = `
        <div class="match-card" style="margin-bottom: 6px;">
          <div class="card-header">
            <span>Simulation Engine: <strong>${meta.simulation_model || 'Monte Carlo'}</strong></span>
            <span class="badge model">Host Boost: ${meta.home_court_boost || 'None'}</span>
          </div>
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
            ${meta.weighting || 'Weighted Regional Ratings'}
          </p>
        </div>
      `;

      let tableHtml = `
        <div class="table-container">
          <table class="medal-table">
            <thead>
              <tr>
                <th>Team</th>
                <th>🥇 Gold</th>
                <th>🥈 Silver</th>
                <th>🥉 Bronze</th>
                <th>Podium</th>
              </tr>
            </thead>
            <tbody>
              ${teams.map(t => {
                const info = getNOCInfo(t.team);
                return `
                  <tr>
                    <td>
                      <div class="team-cell">
                        <span class="rank-num">${t.rank}</span>
                        <span class="team-flag">${info.flag}</span>
                        <span class="team-name-text">${t.team}</span>
                        ${info.code ? `<span class="noc-tag">${info.code}</span>` : ''}
                      </div>
                    </td>
                    ${renderProbCell(t.gold, 'gold')}
                    ${renderProbCell(t.silver, 'silver')}
                    ${renderProbCell(t.bronze, 'bronze')}
                    ${renderProbCell(t.podium, 'podium')}
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      container.innerHTML = metaHeader + tableHtml;
    }

    // ==========================================
    // 2. CALIBRATION TAB
    // ==========================================
    function loadCalibration(predFile, trackerFile, division) {
      const container = document.getElementById('content-cards');
      container.innerHTML = '<div class="empty-state">Computing live model calibration...</div>';

      Promise.all([
        fetch(predFile + '?_nocache=' + Date.now()).then(r => r.json()),
        fetch(trackerFile + '?_nocache=' + Date.now()).then(r => r.json()).catch(() => ({ matches: [] }))
      ])
      .then(([predData, trackerData]) => {
        const teams = (division === 'women') ? predData.women : predData.men;
        const matches = trackerData.matches || [];
        renderCalibrationView(teams, matches);
      })
      .catch(err => {
        container.innerHTML = `<div class="empty-state">Failed to calculate calibration data.</div>`;
      });
    }

    function renderCalibrationView(teams, matches) {
      const container = document.getElementById('content-cards');
      if (!teams || teams.length === 0) {
        container.innerHTML = '<div class="empty-state">No simulation data available.</div>';
        return;
      }

      const rankMap = {};
      teams.forEach(t => { rankMap[normName(t.team)] = t.rank; });

      const records = {};
      let finishedCount = 0;
      let favoriteHits = 0;
      const upsets = [];

      matches.forEach(m => {
        if (m.status !== 'Finished' || !m.winner) return;
        finishedCount++;

        const p1Norm = normName(m.player1);
        const p2Norm = normName(m.player2);
        const wNorm = normName(m.winner);

        records[p1Norm] = records[p1Norm] || { w: 0, l: 0 };
        records[p2Norm] = records[p2Norm] || { w: 0, l: 0 };

        if (wNorm === p1Norm) {
          records[p1Norm].w++;
          records[p2Norm].l++;
        } else {
          records[p2Norm].w++;
          records[p1Norm].l++;
        }

        const r1 = rankMap[p1Norm] || 99;
        const r2 = rankMap[p2Norm] || 99;

        if (r1 !== r2) {
          const favoriteNorm = r1 < r2 ? p1Norm : p2Norm;
          if (wNorm === favoriteNorm) {
            favoriteHits++;
          } else {
            upsets.push({
              winner: m.winner,
              loser: (wNorm === p1Norm) ? m.player2 : m.player1,
              score: m.score,
              round: m.round
            });
          }
        }
      });

      const accuracy = finishedCount > 0 ? Math.round((favoriteHits / finishedCount) * 100) : 100;
      const alignmentStatus = accuracy >= 75 ? 'Optimal' : (accuracy >= 50 ? 'Moderate' : 'Volatile');

      let kpiHtml = `
        <div class="accuracy-grid">
          <div class="kpi-card">
            <div class="kpi-title">Model Accuracy</div>
            <div class="kpi-val">${accuracy}%</div>
            <div class="kpi-sub">${favoriteHits}/${finishedCount} favorites won</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-title">Upsets Logged</div>
            <div class="kpi-val" style="color: ${upsets.length > 0 ? '#fb7185' : '#4ade80'}">${upsets.length}</div>
            <div class="kpi-sub">${upsets.length === 0 ? 'No upsets yet' : 'Underdog wins'}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-title">Calibration</div>
            <div class="kpi-val" style="color: #60a5fa">${alignmentStatus}</div>
            <div class="kpi-sub">50k Sim Alignment</div>
          </div>
        </div>
      `;

      let tableHtml = `
        <div class="table-container">
          <table class="medal-table">
            <thead>
              <tr>
                <th>Team</th>
                <th>Actual W-L</th>
                <th>Trajectory</th>
                <th>🥇 Exp. Gold</th>
              </tr>
            </thead>
            <tbody>
              ${teams.map(t => {
                const rec = records[normName(t.team)] || { w: 0, l: 0 };
                const info = getNOCInfo(t.team);
                let trajectory = '<span class="pill-status pill-on-track">On Track</span>';
                if (rec.l >= 2) {
                  trajectory = '<span class="pill-status pill-at-risk">At Risk</span>';
                } else if (rec.l === 1) {
                  trajectory = '<span class="pill-status pill-contested">Contested</span>';
                }

                return `
                  <tr>
                    <td>
                      <div class="team-cell">
                        <span class="rank-num">${t.rank}</span>
                        <span class="team-flag">${info.flag}</span>
                        <span class="team-name-text">${t.team}</span>
                        ${info.code ? `<span class="noc-tag">${info.code}</span>` : ''}
                      </div>
                    </td>
                    <td>${rec.w}-${rec.l}</td>
                    <td>${trajectory}</td>
                    ${renderProbCell(t.gold, 'gold')}
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      let upsetsHtml = '';
      if (upsets.length > 0) {
        upsetsHtml = `
          <div style="margin-top: 14px;">
            <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">
              ⚠️ Upset Log (Model Deviations)
            </div>
            ${upsets.map(u => {
              const winInfo = getNOCInfo(u.winner);
              const loseInfo = getNOCInfo(u.loser);
              return `
                <div class="match-card" style="border-left: 3px solid var(--badge-danger); padding: 10px 14px; margin-bottom: 6px;">
                  <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <span><strong>${winInfo.flag} ${u.winner}</strong> def. ${loseInfo.flag} ${u.loser}</span>
                    <span style="font-weight: 700; color: #fb7185;">${u.score}</span>
                  </div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">${u.round}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      container.innerHTML = kpiHtml + tableHtml + upsetsHtml;
    }

    // ==========================================
    // 3. TRACKER TAB
    // ==========================================
    function loadMatches(filePath) {
      const container = document.getElementById('content-cards');
      container.innerHTML = '<div class="empty-state">Loading live fixtures...</div>';

      fetch(filePath + '?_nocache=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          renderMatches(data.matches || []);
        })
        .catch(err => {
          container.innerHTML = `<div class="empty-state">No fixtures loaded for this division.</div>`;
        });
    }

    function renderMatches(matches) {
      const container = document.getElementById('content-cards');
      if (!matches || matches.length === 0) {
        container.innerHTML = '<div class="empty-state">No matches scheduled.</div>';
        return;
      }

      container.innerHTML = matches.map(m => {
        const isP1Win = m.winner && (m.winner.trim().toLowerCase() === m.player1.trim().toLowerCase());
        const isP2Win = m.winner && (m.winner.trim().toLowerCase() === m.player2.trim().toLowerCase());
        const statusClass = (m.status || 'upcoming').toLowerCase();

        let dateDisplay = m.date || '';
        if (dateDisplay && dateDisplay.includes('-')) {
          const parts = dateDisplay.split('-');
          const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const monthIndex = parseInt(parts[1], 10) - 1;
          dateDisplay = `${parts[2]} ${months[monthIndex] || ''}`;
        }

        const dateTimeStr = [dateDisplay, m.time].filter(Boolean).join(' • ');
        const isLive = statusClass === 'live';

        return `
          <div class="match-card">
            <div class="card-header">
              <div class="header-titles">
                <span class="match-round">${m.round || 'Match'}</span>
                ${dateTimeStr ? `<span class="match-datetime">📅 ${dateTimeStr}</span>` : ''}
              </div>
              <span class="badge ${statusClass}">
                ${isLive ? '<span class="live-pulse-dot"></span>' : ''}
                ${m.state || m.status}
              </span>
            </div>
            <div class="card-body">
              <div class="team left ${isP1Win ? 'winner' : ''}">
                ${renderTeamBadge(m.player1, false)}
              </div>
              <div class="score-container">
                <span class="score-badge">${m.score}</span>
              </div>
              <div class="team right ${isP2Win ? 'winner' : ''}">
                ${renderTeamBadge(m.player2, true)}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadCurrentView();
  </script>
</body>
</html>
