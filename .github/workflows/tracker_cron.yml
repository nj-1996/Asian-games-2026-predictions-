name: Auto Update Match Trackers

on:
  # Run automatically every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  # Allow manual trigger directly from the GitHub Actions tab
  workflow_dispatch:

permissions:
  # Required to commit updated JSON files back to the repository
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Configure Python runtime environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install network request library
      - name: Install dependencies
        run: pip install requests

      # Step 4: Execute parser script to fetch and format API data
      - name: Run sync script
        run: python scripts/sync_basketball.py

      # Step 5: Check in modified JSON files if scores changed
      - name: Commit and push updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          # Only commit if git detects actual changes in data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update match scores [skip ci]" && git push)
