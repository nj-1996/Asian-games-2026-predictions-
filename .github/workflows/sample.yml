name: Fetch API Sample
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Decode
        run: |
          python -c "
          import urllib.request, zlib, json, sys

          url = 'https://back.results.asiangames2026.org/s/AG2026/en/BKB/schedule/daily/2026-09-10'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Referer': 'https://results.asiangames2026.org/',
              'Origin': 'https://results.asiangames2026.org',
              'Accept': '*/*'
          }

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  raw_bytes = resp.read()
          except Exception as e:
              print(f'HTTP Fetch Failed: {e}')
              sys.exit(1)

          # Attempt decompression variants
          decompressed = None
          for wbits in [zlib.MAX_WBITS, -zlib.MAX_WBITS, 16 + zlib.MAX_WBITS]:
              try:
                  decompressed = zlib.decompress(raw_bytes, wbits).decode('utf-8')
                  break
              except Exception:
                  continue

          # If not compressed, test for raw plaintext/JSON
          if decompressed is None:
              try:
                  decompressed = raw_bytes.decode('utf-8')
              except Exception:
                  print('Could not decode response. First 100 bytes:')
                  print(raw_bytes[:100])
                  sys.exit(1)

          try:
              parsed = json.loads(decompressed)
              with open('data/api_sample.json', 'w', encoding='utf-8') as f:
                  json.dump(parsed, f, indent=2)
              print('Successfully saved data/api_sample.json')
          except Exception as err:
              print('Failed to parse as JSON. First 300 characters of response:')
              print(decompressed[:300])
              sys.exit(1)
          "

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/api_sample.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Fetch decoded API sample' && git push)
