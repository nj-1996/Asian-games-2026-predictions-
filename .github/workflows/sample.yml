name: Fetch API Sample
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests brotli

      - name: Download and Decode
        run: |
          python -c "
          import requests, zlib, json, gzip, sys
          try:
              import brotli
          except Exception:
              brotli = None

          url = 'https://back.results.asiangames2026.org/s/AG2026/en/BKB/schedule/daily/2026-09-10'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Referer': 'https://results.asiangames2026.org/',
              'Accept': '*/*'
          }

          resp = requests.get(url, headers=headers)
          print('HTTP Status:', resp.status_code)
          print('Headers:', dict(resp.headers))
          raw = resp.content
          print(f'Raw payload length: {len(raw)} bytes')
          print('First 16 bytes (hex):', raw[:16].hex())

          decoded_text = None

          methods = [
              ('zlib standard', lambda b: zlib.decompress(b)),
              ('zlib raw deflate (-15)', lambda b: zlib.decompress(b, -15)),
              ('zlib gzip (+16)', lambda b: zlib.decompress(b, 16 + zlib.MAX_WBITS)),
              ('zlib offset 2', lambda b: zlib.decompress(b[2:], -15)),
              ('zlib offset 4', lambda b: zlib.decompress(b[4:])),
              ('gzip lib', lambda b: gzip.decompress(b)),
          ]
          if brotli:
              methods.append(('brotli', lambda b: brotli.decompress(b)))

          for name, fn in methods:
              try:
                  res = fn(raw)
                  print(f'SUCCESS with {name}! Length: {len(res)}')
                  decoded_text = res.decode('utf-8')
                  break
              except Exception as e:
                  print(f'Method {name} failed: {e}')

          if not decoded_text:
              try:
                  json.loads(resp.text)
                  decoded_text = resp.text
                  print('Response was already plain JSON!')
              except Exception:
                  pass

          if not decoded_text:
              print('All unpacking methods failed.')
              sys.exit(1)

          data = json.loads(decoded_text)
          with open('data/api_sample.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          print('Saved cleanly to data/api_sample.json')
          "

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/api_sample.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Fetch decoded API sample' && git push)
          
