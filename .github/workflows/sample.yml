name: Fetch API Sample
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Decode
        run: |
          python -c "
          import urllib.request, zlib, json, sys

          url = 'https://back.results.asiangames2026.org/s/AG2026/en/BKB/schedule/daily/2026-09-10'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Referer': 'https://results.asiangames2026.org/',
              'Accept': '*/*'
          }

          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              payload = resp.read()

          print(f'Initial download size: {len(payload)} bytes')

          # Recursively decompress layers until JSON or uncompressed bytes are reached
          def decompress_layer(data):
              for wbits in [16 + zlib.MAX_WBITS, zlib.MAX_WBITS, -zlib.MAX_WBITS]:
                  try:
                      return zlib.decompress(data, wbits)
                  except Exception:
                      continue
              return None

          for step in range(3):
              decompressed = decompress_layer(payload)
              if decompressed:
                  payload = decompressed
                  print(f'Decompressed layer {step + 1}, new size: {len(payload)} bytes')
              else:
                  break

          # Parse final payload
          text = payload.decode('utf-8', errors='ignore')
          try:
              parsed = json.loads(text)
              with open('data/api_sample.json', 'w', encoding='utf-8') as f:
                  json.dump(parsed, f, indent=2)
              print('Successfully parsed and saved data/api_sample.json!')
          except Exception as e:
              print(f'Could not parse as JSON: {e}')
              print('First 300 characters of final text:')
              print(text[:300])
              sys.exit(1)
          "

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/api_sample.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Fetch decoded API sample' && git push)
