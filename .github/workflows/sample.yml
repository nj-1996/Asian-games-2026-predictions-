name: Fetch API Sample
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download and Decode
        run: |
          python -c "
          import requests, zlib, json, sys

          url = 'https://back.results.asiangames2026.org/s/AG2026/en/BKB/schedule/daily/2026-09-10'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Referer': 'https://results.asiangames2026.org/',
              'Accept': '*/*'
          }

          resp = requests.get(url, headers=headers)
          print('HTTP Status:', resp.status_code)

          # Build Windows-1252 / Latin-1 reverse byte map
          charmap = {}
          for b in range(256):
              try:
                  ch = bytes([b]).decode('cp1252')
                  charmap[ch] = b
              except Exception:
                  try:
                      ch = bytes([b]).decode('latin1')
                      charmap[ch] = b
                  except Exception:
                      pass

          candidates = []

          # Candidate 1: Reverse mapping from resp.text
          try:
              b1 = bytes([charmap.get(c, ord(c) & 0xFF) for c in resp.text])
              candidates.append(('charmap(resp.text)', b1))
          except Exception as e:
              print('Candidate 1 build error:', e)

          # Candidate 2: CP1252 encode
          try:
              candidates.append(('resp.text.encode(cp1252)', resp.text.encode('cp1252', errors='replace')))
          except Exception:
              pass

          # Candidate 3: Latin-1 encode
          try:
              candidates.append(('resp.text.encode(latin1)', resp.text.encode('latin1', errors='replace')))
          except Exception:
              pass

          # Candidate 4: Raw bytes directly
          candidates.append(('resp.content', resp.content))

          decompressed_bytes = None
          used_name = None

          for name, byte_payload in candidates:
              print(f'Testing {name}: First 4 bytes = {byte_payload[:4].hex()}')
              for wbits in [zlib.MAX_WBITS, -zlib.MAX_WBITS, 16 + zlib.MAX_WBITS]:
                  try:
                      decompressed_bytes = zlib.decompress(byte_payload, wbits)
                      used_name = f'{name} with wbits={wbits}'
                      break
                  except Exception:
                      continue
              if decompressed_bytes:
                  break

          if not decompressed_bytes:
              print('Could not decompress payload with any candidate.')
              sys.exit(1)

          print(f'SUCCESS! Decompressed using {used_name}. Length: {len(decompressed_bytes)} bytes')

          json_data = json.loads(decompressed_bytes.decode('utf-8'))
          with open('data/api_sample.json', 'w', encoding='utf-8') as f:
              json.dump(json_data, f, indent=2)

          print('Saved parsed JSON to data/api_sample.json')
          "

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/api_sample.json
          git diff --quiet && git diff --staged --quiet || (git commit -m 'Fetch decoded API sample' && git push)
