name: Fetch API Sample
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and Decode
        run: |
          python -c "
          import urllib.request, zlib, json
          url = 'https://back.results.asiangames2026.org/s/AG2026/en/BKB/schedule/daily/2026-09-10'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as response:
              data = json.loads(zlib.decompress(response.read()).decode('utf-8'))
              with open('data/api_sample.json', 'w') as f:
                  json.dump(data, f, indent=2)
          "
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/api_sample.json
          git commit -m 'Fetch decoded API sample'
          git push
